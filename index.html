<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boussole GPS</title>
<style>
  body { 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    height:100vh; 
    background:#111; 
    color:white; 
    font-family:sans-serif; 
    flex-direction:column; 
  }
  #status { margin-bottom:20px; }
  #compassValues { font-size: 1.2em; text-align:center; }
</style>
</head>
<body>
<div id="status">Connexion WebSocket...</div>
<div id="compassValues">
  Cap (Nord): 0°<br>
  X: 0<br>
  Y: 0
</div>
<script>
(function() {
  const statusEl = document.getElementById("status");
  const compassEl = document.getElementById("compassValues");
  const ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => { statusEl.textContent = "Connecté ! Déplacez-vous pour voir le cap."; };
  ws.onclose = () => { statusEl.textContent = "Déconnecté."; };
  ws.onerror = (e) => { statusEl.textContent = "Erreur WebSocket."; console.error(e); };

  let prevPos = null;

  function deg2rad(deg) { return deg * Math.PI / 180; }
  function rad2deg(rad) { return rad * 180 / Math.PI; }

  function getHeading(lat1, lon1, lat2, lon2) {
    const dLon = deg2rad(lon2 - lon1);
    const y = Math.sin(dLon) * Math.cos(deg2rad(lat2));
    const x = Math.cos(deg2rad(lat1))*Math.sin(deg2rad(lat2)) -
              Math.sin(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.cos(dLon);
    let brng = rad2deg(Math.atan2(y, x));
    brng = (brng + 360) % 360; // normaliser entre 0 et 360
    return brng;
  }

  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(position => {
      const { latitude, longitude } = position.coords;

      let heading = 0;
      if (prevPos) {
        heading = getHeading(prevPos.latitude, prevPos.longitude, latitude, longitude);
      }
      prevPos = { latitude, longitude };

      const x = Math.min(Math.max(Math.round((Math.sin(deg2rad(heading))+1)/2*255),0),255);
      const y = Math.min(Math.max(Math.round((Math.cos(deg2rad(heading))+1)/2*255),0),255);

      compassEl.innerHTML = `Cap (Nord): ${heading.toFixed(1)}°<br>
                             X: ${x}<br>
                             Y: ${y}`;

      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "compass", heading, x, y }));
      }

    }, err => {
      statusEl.textContent = "Erreur GPS : " + err.message;
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 });
  } else {
    statusEl.textContent = "GPS non supporté sur ce navigateur.";
  }
})();
</script>
</body>
</html>
