<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Compass Simplifié</title>
</head>
<body>
  <h1>Compass</h1>

  <div>
    <div>Beta d: <span id="tiltFB">x</span></div>
    <div>Gamma: <span id="tiltLR">y</span></div>
    <div>Alpha: <span id="direction">z</span></div>
  </div>

  <div id="notice"></div>

  <script>
    // Ouvrir le WebSocket vers ton serveur DMX
    const ws = new WebSocket('ws://192.168.1.16:3000'); // Remplace 3000 par ton port

    ws.onopen = () => { document.getElementById('notice').innerText = 'WebSocket connecté'; };
    ws.onclose = () => { document.getElementById('notice').innerText = 'WebSocket déconnecté'; };
    ws.onerror = (e) => { document.getElementById('notice').innerText = 'Erreur WebSocket'; console.error(e); };

    if (window.DeviceOrientationEvent) {
      document.getElementById('notice').innerHTML = 'API détectée';
      window.addEventListener('deviceorientation', (event) => {
        document.getElementById('tiltLR').innerText = Math.ceil(event.gamma);
        document.getElementById('tiltFB').innerText = Math.ceil(event.beta);
        document.getElementById('direction').innerText = Math.ceil(event.alpha);

        const gamma = event.gamma || 0; // gauche-droite
        const beta = event.beta || 0;   // haut-bas
        const alpha = event.alpha || 0; // orientation
        
        const x = Math.min(Math.max(Math.round((gamma + 90) / 180 * 255), 0), 255);
        const y = Math.min(Math.max(Math.round((beta + 90) / 180 * 255), 0), 255);

        // Envoyer les données DMX via WebSocket
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "dmx", channel1: x, channel2: y }));
        }
      });
    } else {
      document.getElementById('notice').innerHTML = 'API non détectée';
    }
  </script>
</body>
</html>
