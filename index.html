<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Compass DMX</title>
</head>
<body>
  <h1>Compass</h1>

  <div>
    <div>Beta: <span id="tiltFB">x</span></div>
    <div>Gamma: <span id="tiltLR">y</span></div>
    <div>Alpha: <span id="direction">z</span></div>
  </div>

  <div id="notice"></div>

  <script>
    // WebSocket vers ton serveur DMX
    const ws = new WebSocket('ws://192.168.1.16:3000'); // Remplace 8080 par ton port DMX

    ws.onopen = () => { document.getElementById('notice').innerText = 'WebSocket connecté'; };
    ws.onclose = () => { document.getElementById('notice').innerText = 'WebSocket déconnecté'; };
    ws.onerror = (e) => { document.getElementById('notice').innerText = 'Erreur WebSocket'; console.error(e); };

    // Détection du gyroscope / accéléromètre
    if (window.DeviceOrientationEvent) {
      document.getElementById('notice').innerHTML = 'API détectée';

      window.addEventListener('deviceorientation', (event) => {
        const gamma = event.gamma || 0; // gauche-droite
        const beta = event.beta || 0;   // haut-bas
        const alpha = event.alpha || 0; // direction

        // Affichage
        document.getElementById('tiltLR').innerText = Math.ceil(gamma);
        document.getElementById('tiltFB').innerText = Math.ceil(beta);
        document.getElementById('direction').innerText = Math.ceil(alpha);

        // Conversion en DMX 0-255
        const x = Math.min(Math.max(Math.round((gamma + 90) / 180 * 255), 0), 255);
        const y = Math.min(Math.max(Math.round((beta + 90) / 180 * 255), 0), 255);

        // Envoi via WebSocket
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "dmx", channel1: x, channel2: y }));
        }
      });
    } else {
      document.getElementById('notice').innerHTML = 'API non détectée';
    }
  </script>
</body>
</html>
