<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass DMX</title>
  <link href="https://fonts.googleapis.com/css?family=Wallpoet" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      margin: 30px;
      background: rgb(15, 15, 15);
      color: rgb(134, 254, 25);
      text-shadow: 0 0 rgba(134, 254, 25, 0.5);
      font-family: 'Wallpoet', cursive;
      text-align: center;
    }
    .compass {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 20px auto;
      background: #222;
      padding: 20px;
      border-radius: 40px;
      border: 5px solid #444;
      overflow: hidden;
    }
    .compass .disc {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 200;
      width: 260px;
      height: 260px;
      background-size: 100%;
      background-image: url(data:image/svg+xml;base64,...);
    }
    .compass .arrow {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      width: 260px;
      height: 260px;
      background-size: 100%;
      background-image: url(data:image/svg+xml;base64,...);
    }
    .orientation-data { margin-top: 20px; font-size: 20px; }
    #notice { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Compass DMX</h1>
  <div class="compass">
    <div class="arrow"></div>
    <div class="disc" id="compassDiscImg"></div>
  </div>

  <div class="orientation-data">
    <div>Beta: <span id="tiltFB"></span></div>
    <div>Gamma: <span id="tiltLR"></span></div>
    <div>Alpha: <span id="direction"></span></div>
  </div>  
  <div id="notice"></div> 

  <script>
    const ws = new WebSocket('ws://192.168.1.16:3000'); // remplace 8080 par ton port

    ws.onopen = () => { document.getElementById('notice').innerText = 'WebSocket connecté'; };
    ws.onclose = () => { document.getElementById('notice').innerText = 'WebSocket déconnecté'; };
    ws.onerror = (e) => { console.error(e); document.getElementById('notice').innerText = 'Erreur WebSocket'; };

    document.addEventListener('DOMContentLoaded', function() {
      if (window.DeviceOrientationEvent) {
        document.getElementById('notice').innerHTML = 'API gyroscope détectée';
        window.addEventListener('deviceorientation', (eventData) => {
          const tiltLR = eventData.gamma || 0;  // gauche-droite
          const tiltFB = eventData.beta || 0;   // haut-bas
          const dir = eventData.alpha || 0;     // direction

          // Affichage
          document.getElementById('tiltLR').innerHTML = Math.ceil(tiltLR);
          document.getElementById('tiltFB').innerHTML = Math.ceil(tiltFB);
          document.getElementById('direction').innerHTML = Math.ceil(dir);

          const compassDisc = document.getElementById('compassDiscImg');
          compassDisc.style.transform = `rotate(${dir}deg)`;

          // Mapper -90..90 à 0..255 pour DMX
          const x = Math.min(Math.max(Math.round((tiltLR + 90)/180*255), 0), 255);
          const y = Math.min(Math.max(Math.round((tiltFB + 90)/180*255), 0), 255);

          // Envoyer DMX via WebSocket
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "dmx", channel1: x, channel2: y }));
          }
        }, false);
      } else {
        document.getElementById('notice').innerHTML = 'API gyroscope non détectée';
      }
    });
  </script>
</body>
</html>
