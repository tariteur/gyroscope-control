<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boussole GPS</title>
<style>
  body { font-family:sans-serif; background:#111; color:white; text-align:center; padding:50px; }
  #compassDiscImg { width:200px; transition: transform 0.3s ease; }
</style>
</head>
<body>
<h2 id="notice">Initialisation...</h2>
<div>
  Cap: <span id="direction">0</span>°<br>
  X: <span id="tiltLR">0</span><br>
  Y: <span id="tiltFB">0</span>
</div>
<img id="compassDiscImg" src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Compass_rose_pale.svg/200px-Compass_rose_pale.svg.png" alt="Boussole">

<script>
document.addEventListener('DOMContentLoaded', function(event) {
  const noticeEl = document.getElementById('notice');
  let prevPos = null;

  function deg2rad(deg) { return deg * Math.PI / 180; }
  function rad2deg(rad) { return rad * 180 / Math.PI; }

  function getHeading(lat1, lon1, lat2, lon2) {
    const dLon = deg2rad(lon2 - lon1);
    const y = Math.sin(dLon) * Math.cos(deg2rad(lat2));
    const x = Math.cos(deg2rad(lat1))*Math.sin(deg2rad(lat2)) -
              Math.sin(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.cos(dLon);
    let brng = rad2deg(Math.atan2(y, x));
    brng = (brng + 360) % 360;
    return brng;
  }

  if ("geolocation" in navigator) {
    noticeEl.innerHTML = "Utilisation du GPS pour la boussole";
    navigator.geolocation.watchPosition(position => {
      const { latitude, longitude } = position.coords;
      let heading = 0;

      if (prevPos) {
        heading = getHeading(prevPos.latitude, prevPos.longitude, latitude, longitude);
      }
      prevPos = { latitude, longitude };

      // X et Y peuvent être mappés à -128..127 ou 0..255 selon tes besoins
      const x = Math.min(Math.max(Math.round((Math.sin(deg2rad(heading))+1)/2*255),0),255);
      const y = Math.min(Math.max(Math.round((Math.cos(deg2rad(heading))+1)/2*255),0),255);

      deviceOrientationHandler(x, y, heading);

    }, err => {
      noticeEl.innerHTML = "Erreur GPS : " + err.message;
    }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 });
  } else {
    noticeEl.innerHTML = "GPS non supporté sur ce navigateur";
  }

  function deviceOrientationHandler(tiltLR, tiltFB, dir) {
    document.getElementById('tiltLR').innerHTML = Math.ceil(tiltLR);
    document.getElementById('tiltFB').innerHTML = Math.ceil(tiltFB);
    document.getElementById('direction').innerHTML = Math.ceil(dir);

    const compassDisc = document.getElementById('compassDiscImg');
    compassDisc.style.transform = `rotate(${dir}deg)`;
    compassDisc.style.webkitTransform = `rotate(${dir}deg)`;
    compassDisc.style.MozTransform = `rotate(${dir}deg)`;
  }
});
</script>
</body>
</html>
